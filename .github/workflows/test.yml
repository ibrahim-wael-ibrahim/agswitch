name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -d -e $(find . -name '*.go' -not -path './vendor/*') | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...
